- name: create instance for databases
  hosts: localhost
  connection: local
  vars:
    instance:
      - mongodb
      - redis
      - mysql
      - rabbitmq
    action: create
    ami_id: ami-0055977a6e828a4f4
  tasks:
   - name: create EC2 instances
     amazon.aws.ec2_instance:
       name: "roboshop-{{ item }}"
       state: present
       region: "us-east-1"
       image_id: "{{ ami_id }}"
       instance_type: t3.micro
       security_groups: 
        - "roboshop-{{ item }}"
        - RoboShop-Main
     loop: "{{ instance }}"
     when: action == "create"
     register: ec2_info

   - debug:
      msg: "{{ ec2_info.results }}"
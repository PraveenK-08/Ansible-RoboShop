- name: configuring the mysql server
  hosts: mysql.teram.store
  become: true
  tasks:
    - name: enable mysql 8 version
      command: dnf module enable mysql:8.4 -y
    - name:   install mysql
      package:
        name: mysql-server
        state: present
    - name: start and enable mysql service
      service:
        name: mysqld
        state: started
        enabled: true
    - name: set root password for mysql
      ansible.mysql.mysql_user:
       name: root
       password: RoboShop@1            
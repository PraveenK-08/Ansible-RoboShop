- name: configuration of payment server
  hosts: payment.teram.store
  become: true
  tasks:
   - name: installing python 
     dnf: 
      name: 
       - python3.14
       - python3.14-pip
      state: present

   - name: creating application user
     user: 
       name: roboshop
       create_home: false
       shell: /sbin/nologin
       home: /app
       comment: roboshop system user
       system: true
       state: present

   - name: removing  existing app directory
     file: 
       path: /app
       state: absent

   - name: creating  app directory
     file:
      path: /app
      state: directory

   - name: clear exisiting payment.zip file
     file:
      path: /tmp/payment.zip
      state: absent

   - name: downloading  new payment.zip file
     get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
      dest: /tmp/payment.zip

   - name: unzip  file
     unarchive: 
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

   - name: installing  dependencies
     ansible.builtin.pip:
       requirements: /app/requirements.txt
       virtualenv: /app/.venv
       virtual commad: python3.14 -m venv

   - name: creating  service file
     copy:
       src: payment.service.j2
       dest: /etc/systemd/system/payment.serivce

   - name: reloading the server
     systemd_service:
       deamon_reload: true

   - name: restarting and enable the server
     service:
       name: payment
       state: restarted
       enabled: true      

                      



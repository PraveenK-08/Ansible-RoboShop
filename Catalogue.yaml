- name: configuration of Catalogue Server
  hosts: catalogue.teram.store
  become: yes
  tasks:
    - name: disable nodejs module
      command: dnf module disable nodejs -y
    
    - name: Enable nodejs module
      command: dnf module enable nodejs:24 -y

    - name: installing nodejs 
      package:
       name: nodejs
       state: present

    - name: check installed version
      command: node --version
      register: nodeversion

    - name: remove existing app directory
      file: 
       path: /app
       state: absent  

    - name: creating app directory
      file:
        path: /app
        state: directory
     
    - name: creating system user
      user:
       name: roboshop
       create_home: false
       state: present
       shell: /sbin/nologin
       home: /app
       system: true
       comment: roboshop system user
 
    - name:  remove existing catalogue.zip
      file: 
        path: /tmp/catalogue.zip
        state: absent

    - name: downloading catalogue zip file
      get_url:
       url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
       dest: /tmp/catalogue.zip

    - name: extact por unzip the file
      unarchive:
       src: /tmp/catalogue.zip
       dest: /app
       remote_src: yes

    - name: Downloading and installing dependencies
      community.general.npm:
       path: /app
       state: present          
    
    - name: creating service file for catalogue
      copy:
       src: catalogue.service.j2
       dest: /etc/systemd/system/catalogue.service

    - name: installing mongodb client to load data
      dnf:
        name: mongodb-mongosh
        state: present

    - name: check whether the data is loaded or not
      command: mongosh --host mongodb.teram.store --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'  
      register: availableDataCount

    - name: loading the data
      shell: mongosh --host mongodb.teram.store </app/db/master-data.js
      when: availableDatacount.stdout | == 0

    - name: reloading the server
      systemd_service:
       daemon_reload: true

    - name: start and enable the service
      service:
       name: catalogue
       state: restarted
       enabled: true     





      





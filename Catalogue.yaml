- name: configuration of Catalogue Server
  hosts: catalogue.teram.store
  become: yes
  tasks:
    - name: disable nodejs module
      command: dnf module disable nodejs -y
    
    - name: Enable nodejs module
      command: dnf module enable nodejs:24 -y

    - name: installing nodejs 
      package:
       name: nodejs
       state: present

    - name: check installed version
      command: node --version
      register: nodeversion
    - name: creating app directory
      file:
        path: /app
        state: directory
     
    - name: creating system user
      user:
       name: roboshop
       state: present
       shell: /sbin/nologin
       home: /app
       system: true
       comment: roboshop system user

    - name: check system user    
      command: id roboshop
      register: user
      debug:
       -msg: {{user}}




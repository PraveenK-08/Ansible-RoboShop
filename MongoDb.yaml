- name: mongodb server 
  hosts: mongodb.teram.store
  become: true
  tasks:
    - name: creating repo file for mongodb
      copy:
        src: mongodb.repo
        dest: /etc/yum.repos.d/mongodb.repo
    - name: install mongodb
      package:
         name: mongodb-org
         state: present
    - name: start mongodb service
      service:
        name: mongod
        state: started
        enabled: true
    - name: Edit bindIp in mongodb config file
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^  bindIp:'
        line: '  bindIp: 0.0.0.0'
    - name: restart mongodb service
      service:
        name: mongod
        state: restarted

- name: create EC2 instances for Database Servers
  hosts: localhost
  connection: local
  become: true
  vars:
    instance:
      - mongodb
      - redis
      - mysql
      - rabbitmq
    action: create
    ami_id: ami-0055977a6e828a4f4
  tasks:
   - name: create EC2 instances
     amazon.aws.ec2_spot_instance:
       launch_specification:
         tags:
          name: "roboshop-{{ item }}"
         image_id: "{{ ami_id }}"
         instance_type: t3.micro`
         security_groups: "roboshop-{{ item }}"
         type: "one-time"
     loop: "{{ instance }}"
     when: action == "create"
     register: ec2_info

   - debug:
      msg: "{{ ec2_info.results }}"

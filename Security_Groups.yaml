- name: create DataDase Servers
  hosts: localhost
  connection: local
  vars: 
   instance:
     - mongodb
     - redis
     - mysql
     - rabbitmq
   action: create
   my_ip: 59.93.116.183/32
  tasks:
   - name: create security groups
     amazon.aws.ec2_security_group:
      name: "roboshop-{{ item }}"
      description: "Security group for web server {{ item }}"
      region: "us-east-1"
      rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}"
     register: sg_info 
     loop: "{{ instance }}"
   - name: print the output
     debug:
       msg: "{{ sg_info.results }}"